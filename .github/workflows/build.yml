name: Build iOS Apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select --switch \
              "/Applications/Xcode_16.4.app/Contents/Developer"
          fi

          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          xcodegen generate --spec project.yml

          PROJECT_PATH="$(find . -maxdepth 3 \
            -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::No Xcode project was generated."
            exit 1
          fi

          PROJECT_PATH="${PROJECT_PATH#./}"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build Radix with retry
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs

          DERIVED_DATA="$PWD/build/DerivedData-Radix"
          ATTEMPT=1

          while [ "$ATTEMPT" -le 2 ]; do
            LOG="$PWD/build/logs/Radix-attempt-$ATTEMPT.log"

            echo "Building Radix: attempt $ATTEMPT of 2"

            if [ "$ATTEMPT" -eq 2 ]; then
              rm -rf "$DERIVED_DATA"
            fi

            set +e

            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme Radix \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG"

            STATUS=${PIPESTATUS[0]}

            set -e

            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q \
              "The Xcode build system has crashed" "$LOG"; then
              echo "::error::Radix failed for a reason other than the known build-system crash."
              exit "$STATUS"
            fi

            if [ "$ATTEMPT" -eq 2 ]; then
              echo "::error::Xcode build service crashed twice while building Radix."
              exit "$STATUS"
            fi

            echo "Xcode build service crashed. Retrying with fresh DerivedData."
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Build hurr1c4ne with retry
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs

          DERIVED_DATA="$PWD/build/DerivedData-hurr1c4ne"
          ATTEMPT=1

          while [ "$ATTEMPT" -le 2 ]; do
            LOG="$PWD/build/logs/hurr1c4ne-attempt-$ATTEMPT.log"

            echo "Building hurr1c4ne: attempt $ATTEMPT of 2"

            if [ "$ATTEMPT" -eq 2 ]; then
              rm -rf "$DERIVED_DATA"
            fi

            set +e

            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme hurr1c4ne \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG"

            STATUS=${PIPESTATUS[0]}

            set -e

            if [ "$STATUS" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q \
              "The Xcode build system has crashed" "$LOG"; then
              echo "::error::hurr1c4ne failed for a reason other than the known build-system crash."
              exit "$STATUS"
            fi

            if [ "$ATTEMPT" -eq 2 ]; then
              echo "::error::Xcode build service crashed twice while building hurr1c4ne."
              exit "$STATUS"
            fi

            echo "Xcode build service crashed. Retrying with fresh DerivedData."
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Collect Xcode crash reports
        if: always()
        shell: bash
        run: |
          set -uo pipefail

          CRASH_DIR="$PWD/build/crash-reports"
          mkdir -p "$CRASH_DIR"

          REPORT_DIRS=(
            "$HOME/Library/Logs/DiagnosticReports"
            "/Library/Logs/DiagnosticReports"
          )

          FOUND=0

          for REPORT_DIR in "${REPORT_DIRS[@]}"; do
            if [ ! -d "$REPORT_DIR" ]; then
              continue
            fi

            echo "Checking crash reports in: $REPORT_DIR"

            while IFS= read -r -d '' REPORT; do
              FOUND=1

              DESTINATION="$CRASH_DIR/$(basename "$REPORT")"

              if [ -e "$DESTINATION" ]; then
                DESTINATION="$CRASH_DIR/$(basename "$REPORT_DIR")-$(basename "$REPORT")"
              fi

              if cp "$REPORT" "$DESTINATION"; then
                echo "Collected: $(basename "$REPORT")"
              else
                echo "::warning::Could not copy crash report: $REPORT"
              fi
            done < <(
              find "$REPORT_DIR" \
                -type f \
                \( -name '*.crash' -o -name '*.ips' \) \
                -mmin -360 \
                -print0 2>/dev/null
            )
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No recent .crash or .ips reports were found."
          fi

          {
            echo "Crash report collection time:"
            date
            echo
            echo "Xcode version:"
            xcodebuild -version
            echo
            echo "Selected developer directory:"
            xcode-select -p
            echo
            echo "Crash report files collected:"
            find "$CRASH_DIR" \
              -maxdepth 1 \
              -type f \
              -print
          } > "$CRASH_DIR/collection-info.txt"

          echo "Crash report collection finished."

      - name: Package unsigned IPAs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ipas

          package_app() {
            local app_path="$1"
            local app_name
            local staging

            if [ ! -d "$app_path" ]; then
              echo "::error::App bundle not found: $app_path"
              return 1
            fi

            app_name="$(basename "$app_path" .app)"
            staging="$PWD/build/ipa-staging-$app_name"

            rm -rf "$staging"
            mkdir -p "$staging/Payload"

            cp -R "$app_path" "$staging/Payload/"

            (
              cd "$staging"

              /usr/bin/zip -qry \
                "$GITHUB_WORKSPACE/build/ipas/$app_name-unsigned.ipa" \
                Payload
            )
          }

          package_app \
            "build/DerivedData-Radix/Build/Products/Release-iphoneos/Radix.app"

          package_app \
            "build/DerivedData-hurr1c4ne/Build/Products/Release-iphoneos/hurr1c4ne.app"

      - name: Upload diagnostics and IPAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-and-apps
          path: |
            build/logs/
            build/crash-reports/
            build/ipas/
          if-no-files-found: warn
          retention-days: 14
