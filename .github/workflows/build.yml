name: Build hurr1c4ne and Radix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build hurr1c4ne
        run: |
          xcodebuild \
            -project hurr1c4ne.xcodeproj \
            -scheme hurr1c4ne \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build Radix
        run: |
          xcodebuild \
            -project hurr1c4ne.xcodeproj \
            -scheme Radix \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify both apps
        run: |
          set -e

          HURRICANE="build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app"
          RADIX="build/DerivedData/Build/Products/Release-iphoneos/Radix.app"

          test -d "$HURRICANE" || {
            echo "ERROR: hurr1c4ne.app was not produced"
            exit 1
          }

          test -d "$RADIX" || {
            echo "ERROR: Radix.app was not produced"
            exit 1
          }

          echo "=== hurr1c4ne bundle identifier ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$HURRICANE/Info.plist"

          echo "=== Radix bundle identifier ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" \
            "$RADIX/Info.plist"

      - name: Package both applications
        run: |
          set -e

          mkdir -p build/distribution

          ditto \
            "build/DerivedData/Build/Products/Release-iphoneos/hurr1c4ne.app" \
            "build/distribution/hurr1c4ne.app"

          ditto \
            "build/DerivedData/Build/Products/Release-iphoneos/Radix.app" \
            "build/distribution/Radix.app"

          cd build/distribution
          zip -qry ../hurr1c4ne-Radix-apps.zip \
            hurr1c4ne.app Radix.app

      - name: Upload both applications
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-Radix-apps
          path: build/hurr1c4ne-Radix-apps.zip
          if-no-files-found: error
