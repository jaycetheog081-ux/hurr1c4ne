name: Build iOS Apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode and locate project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select --switch \
              "/Applications/Xcode_16.4.app/Contents/Developer"
          fi

          xcodebuild -version

          echo "Searching for Xcode projects and workspaces..."
          find . -maxdepth 5 \
            \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) \
            -print

          PROJECT_PATH="$(find . -maxdepth 5 -name "*.xcodeproj" -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "::error::No .xcodeproj found in the repository."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

          PROJECT_PATH="${PROJECT_PATH#./}"

          echo "Found project: $PROJECT_PATH"
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

          xcodebuild -list -project "$PROJECT_PATH"

      - name: Build Radix
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme Radix \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData-Radix" \
            -parallelizeTargets NO \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/Radix-build.log

      - name: Build hurr1c4ne
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs

          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme hurr1c4ne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData-hurr1c4ne" \
            -parallelizeTargets NO \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/hurr1c4ne-build.log

      - name: Package unsigned IPAs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ipas

          package_app() {
            local app_path="$1"
            local app_name
            local staging

            if [ ! -d "$app_path" ]; then
              echo "::error::App bundle not found: $app_path"
              return 1
            fi

            app_name="$(basename "$app_path" .app)"
            staging="$PWD/build/ipa-staging-$app_name"

            rm -rf "$staging"
            mkdir -p "$staging/Payload"
            cp -R "$app_path" "$staging/Payload/"

            (
              cd "$staging"
              /usr/bin/zip -qry \
                "$GITHUB_WORKSPACE/build/ipas/$app_name-unsigned.ipa" \
                Payload
            )
          }

          package_app \
            "build/DerivedData-Radix/Build/Products/Release-iphoneos/Radix.app"

          package_app \
            "build/DerivedData-hurr1c4ne/Build/Products/Release-iphoneos/hurr1c4ne.app"

      - name: Upload build logs and app artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-and-apps
          path: |
            build/logs/
            build/ipas/
          if-no-files-found: warn
          retention-days: 14
