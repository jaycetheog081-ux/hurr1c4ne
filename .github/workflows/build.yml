name: Build iOS Apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build hurr1c4ne and Radix
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
          fi

          echo "Selected Xcode:"
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "project.yml" ]; then
            echo "Error: project.yml was not found in the repository root."
            exit 1
          fi

          xcodegen generate --spec project.yml

          PROJECT_PATH="$(find . -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)"

          if [ -z "$PROJECT_PATH" ]; then
            echo "Error: XcodeGen did not produce an Xcode project."
            exit 1
          fi

          PROJECT_PATH="${PROJECT_PATH#./}"

          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

          echo "Generated project: $PROJECT_PATH"
          xcodebuild -list -project "$PROJECT_PATH"

      - name: Create build directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/logs
          mkdir -p build/crash-reports
          mkdir -p build/ipas

      - name: Build Radix
        shell: bash
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=2
          BUILD_SUCCEEDED=0

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Building Radix: attempt $ATTEMPT of $MAX_ATTEMPTS"

            if [ "$ATTEMPT" -gt 1 ]; then
              echo "Removing previous Radix DerivedData before retry."
              rm -rf build/DerivedData-Radix
            fi

            set +e

            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme Radix \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData-Radix" \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              CLANG_ENABLE_MODULES=NO \
              build \
              2>&1 | tee "build/logs/Radix-attempt-${ATTEMPT}.log"

            BUILD_STATUS=${PIPESTATUS[0]}

            set -e

            if [ "$BUILD_STATUS" -eq 0 ]; then
              BUILD_SUCCEEDED=1
              break
            fi

            echo "Radix build attempt $ATTEMPT failed with exit code $BUILD_STATUS."

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying Radix with fresh DerivedData."
            fi
          done

          if [ "$BUILD_SUCCEEDED" -ne 1 ]; then
            echo "Error: Radix failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          echo "Radix built successfully."

      - name: Build hurr1c4ne
        shell: bash
        run: |
          set -uo pipefail

          MAX_ATTEMPTS=2
          BUILD_SUCCEEDED=0

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Building hurr1c4ne: attempt $ATTEMPT of $MAX_ATTEMPTS"

            if [ "$ATTEMPT" -gt 1 ]; then
              echo "Removing previous hurr1c4ne DerivedData before retry."
              rm -rf build/DerivedData-hurr1c4ne
            fi

            set +e

            xcodebuild \
              -project "$PROJECT_PATH" \
              -scheme hurr1c4ne \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData-hurr1c4ne" \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              CLANG_ENABLE_MODULES=NO \
              build \
              2>&1 | tee "build/logs/hurr1c4ne-attempt-${ATTEMPT}.log"

            BUILD_STATUS=${PIPESTATUS[0]}

            set -e

            if [ "$BUILD_STATUS" -eq 0 ]; then
              BUILD_SUCCEEDED=1
              break
            fi

            echo "hurr1c4ne build attempt $ATTEMPT failed with exit code $BUILD_STATUS."

            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying hurr1c4ne with fresh DerivedData."
            fi
          done

          if [ "$BUILD_SUCCEEDED" -ne 1 ]; then
            echo "Error: hurr1c4ne failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

          echo "hurr1c4ne built successfully."

      - name: Collect Xcode crash reports
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p build/crash-reports

          REPORT_COUNT=0

          for REPORT_DIRECTORY in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "/Library/Logs/DiagnosticReports"
          do
            if [ -d "$REPORT_DIRECTORY" ]; then
              while IFS= read -r -d '' REPORT; do
                REPORT_NAME="$(basename "$REPORT")"

                if cp -f "$REPORT" "build/crash-reports/$REPORT_NAME"; then
                  echo "Collected crash report: $REPORT_NAME"
                  REPORT_COUNT=$((REPORT_COUNT + 1))
                fi
              done < <(
                find "$REPORT_DIRECTORY" \
                  -type f \
                  \( -name '*.crash' -o -name '*.ips' \) \
                  -mmin -360 \
                  -print0
              )
            fi
          done

          {
            echo "Collection date: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Xcode version:"
            xcodebuild -version 2>&1 || true
            echo
            echo "Selected developer directory:"
            xcode-select -p 2>&1 || true
            echo
            echo "Crash reports collected: $REPORT_COUNT"
            echo
            echo "Collected report files:"

            find build/crash-reports \
              -maxdepth 1 \
              -type f \
              ! -name 'collection-info.txt' \
              -print
          } > build/crash-reports/collection-info.txt

          echo "Crash-report collection finished."

      - name: Package unsigned IPAs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          package_ipa() {
            APP_NAME="$1"
            APP_PATH="$2"
            IPA_PATH="build/ipas/${APP_NAME}-unsigned.ipa"
            TEMP_DIRECTORY="build/ipa-staging/${APP_NAME}"

            if [ ! -d "$APP_PATH" ]; then
              echo "Error: application bundle not found: $APP_PATH"
              return 1
            fi

            rm -rf "$TEMP_DIRECTORY"
            mkdir -p "$TEMP_DIRECTORY/Payload"

            cp -R "$APP_PATH" "$TEMP_DIRECTORY/Payload/"

            (
              cd "$TEMP_DIRECTORY"
              /usr/bin/zip -qry \
                "$GITHUB_WORKSPACE/$IPA_PATH" \
                Payload
            )

            if [ ! -s "$IPA_PATH" ]; then
              echo "Error: IPA packaging failed for $APP_NAME."
              return 1
            fi

            echo "Created $IPA_PATH"
            /usr/bin/ls -lh "$IPA_PATH"
          }

          package_ipa \
            "Radix" \
            "build/DerivedData-Radix/Build/Products/Release-iphoneos/Radix.app"

          package_ipa \
            "hurr1c4ne" \
            "build/DerivedData-hurr1c4ne/Build/Products/Release-iphoneos/hurr1c4ne.app"

      - name: Upload build diagnostics and apps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-and-apps
          path: |
            build/logs/
            build/crash-reports/
            build/ipas/
          if-no-files-found: warn
          retention-days: 14
