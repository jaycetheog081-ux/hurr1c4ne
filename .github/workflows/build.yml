name: Build hurr1c4ne and Radix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select --switch \
              "/Applications/Xcode_16.4.app/Contents/Developer"
          fi

          xcodebuild -version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          test -f project.yml
          test -f Radix/RadixViewController.h
          test -f Radix/RadixViewController.m

          xcodegen generate

          test -d hurr1c4ne.xcodeproj

          xcodebuild -list \
            -project hurr1c4ne.xcodeproj

      - name: Build Radix
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs
          LOG="build/logs/Radix-build.log"
          DERIVED_DATA="$PWD/build/DerivedData-Radix"

          for attempt in 1 2; do
            echo "Building Radix: attempt $attempt of 2"

            if [ "$attempt" -eq 2 ]; then
              rm -rf "$DERIVED_DATA"
            fi

            set +e
            xcodebuild \
              -project hurr1c4ne.xcodeproj \
              -scheme Radix \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG"

            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q \
              "unexpected service error: The Xcode build system has crashed" \
              "$LOG"; then
              echo "Radix build failed. See the build log above."
              exit "$status"
            fi

            echo "Xcode build service crashed."
          done

          echo "Radix failed after two attempts."
          exit 1

      - name: Build hurr1c4ne
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs
          LOG="build/logs/hurr1c4ne-build.log"
          DERIVED_DATA="$PWD/build/DerivedData-hurr1c4ne"

          for attempt in 1 2; do
            echo "Building hurr1c4ne: attempt $attempt of 2"

            if [ "$attempt" -eq 2 ]; then
              rm -rf "$DERIVED_DATA"
            fi

            set +e
            xcodebuild \
              -project hurr1c4ne.xcodeproj \
              -scheme hurr1c4ne \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG"

            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q \
              "unexpected service error: The Xcode build system has crashed" \
              "$LOG"; then
              echo "hurr1c4ne build failed. See the build log above."
              exit "$status"
            fi

            echo "Xcode build service crashed."
          done

          echo "hurr1c4ne failed after two attempts."
          exit 1

      - name: Package unsigned IPA files
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ipas

          for name in Radix hurr1c4ne; do
            case "$name" in
              Radix)
                app="build/DerivedData-Radix/Build/Products/Release-iphoneos/Radix.app"
                ;;
              hurr1c4ne)
                app="build/DerivedData-hurr1c4ne/Build/Products/Release-iphoneos/hurr1c4ne.app"
                ;;
            esac

            if [ ! -d "$app" ]; then
              echo "ERROR: App bundle not found: $app"
              exit 1
            fi

            staging="$PWD/build/ipa-staging-$name"
            rm -rf "$staging"
            mkdir -p "$staging/Payload"

            cp -R "$app" "$staging/Payload/"

            (
              cd "$staging"
              /usr/bin/zip -qry \
                "$PWD/../ipas/$name-unsigned.ipa" \
                Payload
            )
          done

      - name: Upload build logs and IPAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hurr1c4ne-Radix-build-artifacts
          path: |
            build/logs/
            build/ipas/
          if-no-files-found: warn
          retention-days: 14
