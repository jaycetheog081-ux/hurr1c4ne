name: Build iOS Apps

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select --switch \
              "/Applications/Xcode_16.4.app/Contents/Developer"
          else
            echo "Xcode_16.4.app is not installed on this runner."
            xcodebuild -version
          fi

          xcodebuild -version
          xcodebuild -list -project hurr1c4ne.xcodeproj

      - name: Build Radix
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs

          PROJECT="hurr1c4ne.xcodeproj"
          SCHEME="Radix"
          DERIVED_DATA="$PWD/build/DerivedData-Radix"
          LOG="$PWD/build/logs/Radix-build.log"

          attempt=1

          while [ "$attempt" -le 2 ]; do
            echo "Radix build attempt $attempt of 2"

            if [ "$attempt" -eq 2 ]; then
              rm -rf "$DERIVED_DATA"
            fi

            set +e

            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              -parallelizeTargets NO \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG"

            status=${PIPESTATUS[0]}

            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q \
              "unexpected service error: The Xcode build system has crashed" \
              "$LOG"; then
              echo "Build failed for a reason other than the known Xcode build-system crash."
              exit "$status"
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Xcode build service crashed. Retrying with fresh DerivedData."
            fi

            attempt=$((attempt + 1))
          done

          echo "Radix build failed after retry."
          exit 1

      - name: Build hurr1c4ne
        shell: bash
        run: |
          set -uo pipefail

          mkdir -p build/logs

          PROJECT="hurr1c4ne.xcodeproj"
          SCHEME="hurr1c4ne"
          DERIVED_DATA="$PWD/build/DerivedData-hurr1c4ne"
          LOG="$PWD/build/logs/hurr1c4ne-build.log"

          attempt=1

          while [ "$attempt" -le 2 ]; do
            echo "hurr1c4ne build attempt $attempt of 2"

            if [ "$attempt" -eq 2 ]; then
              rm -rf "$DERIVED_DATA"
            fi

            set +e

            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$DERIVED_DATA" \
              -parallelizeTargets NO \
              -jobs 1 \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG"

            status=${PIPESTATUS[0]}

            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if ! grep -q \
              "unexpected service error: The Xcode build system has crashed" \
              "$LOG"; then
              echo "Build failed for a reason other than the known Xcode build-system crash."
              exit "$status"
            fi

            if [ "$attempt" -eq 1 ]; then
              echo "Xcode build service crashed. Retrying with fresh DerivedData."
            fi

            attempt=$((attempt + 1))
          done

          echo "hurr1c4ne build failed after retry."
          exit 1

      - name: Package unsigned IPAs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/ipas

          package_app() {
            local app_path="$1"
            local app_name
            local staging

            if [ ! -d "$app_path" ]; then
              echo "App bundle not found: $app_path"
              return 1
            fi

            app_name="$(basename "$app_path" .app)"
            staging="$PWD/build/ipa-staging-$app_name"

            rm -rf "$staging"
            mkdir -p "$staging/Payload"

            cp -R "$app_path" "$staging/Payload/"

            (
              cd "$staging"
              /usr/bin/zip -qry \
                "$PWD/../ipas/$app_name-unsigned.ipa" \
                Payload
            )
          }

          package_app \
            "build/DerivedData-Radix/Build/Products/Release-iphoneos/Radix.app"

          package_app \
            "build/DerivedData-hurr1c4ne/Build/Products/Release-iphoneos/hurr1c4ne.app"

      - name: Upload build logs and app artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics-and-apps
          path: |
            build/logs/
            build/ipas/
          if-no-files-found: warn
          retention-days: 14
